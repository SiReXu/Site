<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skyborn — Подать заявку</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<main>
  <div class="mini"><img src="img/hero.svg" alt=""><h1>Заявка в семью</h1></div>
  <div class="wrap block" style="max-width:760px">
    <div class="card rv">
      <p class="sub">Заполните анкету — мы рассмотрим её в ближайшее время.</p>
      <form class="f" id="applyForm" autocomplete="off">
        <div class="row2">
          <label>Игровой ник<input name="nickname" required maxlength="32" placeholder="Имя Фамилия"></label>
          <label>Статик (ID)<input name="staticId" required maxlength="12" placeholder="12345"></label>
        </div>
        <div class="row2">
          <label>Возраст<input name="age" type="number" min="12" max="99" required></label>
          <label>Опыт в RP<select name="exp"><option>Новичок</option><option>До года</option><option>1–3 года</option><option>Больше 3 лет</option></select></label>
        </div>
        <label>Где играли раньше<textarea name="experience" maxlength="500" placeholder="Семьи, серверы, должности"></textarea></label>
        <label>О себе и почему именно Skyborn<textarea name="about" required maxlength="1000" placeholder="Расскажите о себе"></textarea></label>
        <button class="btn" type="submit">Отправить заявку</button>
      </form>
      <div id="applyOut"></div>
    </div>
  </div>
</main>
<script src="js/config.js"></script><script src="js/app.js"></script></body></html>
